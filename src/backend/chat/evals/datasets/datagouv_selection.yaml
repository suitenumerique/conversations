    evaluators:
      - DidNotCallTool:
          name_regex: "^datagouv_"
          evaluation_name: did_not_call_datagouv
      - HasMatchingSpan:
          query:
            or_:
              - has_attributes:
                  gen_ai.tool.name: "document_search_rag"
              - has_attributes:
                  gen_ai.tool.name: "summarize"
          evaluation_name: called_document_tool

