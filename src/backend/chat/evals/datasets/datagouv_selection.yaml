  # ── FALLBACK — data.gouv.fr n'a pas la réponse : web_search APRÈS data.gouv.fr ─

  - name: ruches_dijon
    inputs:
      user_message: "Combien de ruches sont déclarées à Dijon ?"
    metadata:
      difficulty: medium
      category: fallback
      description: Aucun jeu de données — consulter data.gouv.fr puis se rabattre sur web_search
    evaluators:
      - CalledTool:
          name_regex: "^datagouv_"
          evaluation_name: called_datagouv
      - HasMatchingSpan:
          query:
            has_attributes:
              gen_ai.tool.name: "web_search"
          evaluation_name: called_web_search
      - ToolCalledBefore:
          first: "^datagouv_"
          then: "^web_search$"
          evaluation_name: datagouv_before_web_search

