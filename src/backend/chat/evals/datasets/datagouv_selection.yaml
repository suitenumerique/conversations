# DataGouv selection — le connecteur data.gouv.fr est disponible (opt-in, jamais forcé) :
# l'agent doit le consulter pour tout fait sur la France que les données publiques
# officielles enregistrent, n'utiliser la recherche web qu'en repli (après data.gouv.fr),
# et ne pas le consulter hors de ce périmètre. Outils data.gouv.fr = snapshot du serveur
# réel, résultats = scénarios réels tronqués (fixtures/datagouv_scenarios.yaml).
# Les cas « stable_fact » échouent tant que l'instruction de production exclut la
# « general knowledge » : c'est attendu.

cases:
  # ── ANSWERED — data.gouv.fr a la réponse : pas de web_search ────────────────

  - name: prix_gazole_rennes
    inputs:
      user_message: "Quel est le prix du gazole à Rennes en ce moment ?"
      tool_output: '{"datagouv_scenario": "carburants_rennes"}'
    metadata:
      difficulty: easy
      category: answered
      description: Prix des carburants par commune — flux quotidien du ministère de l'économie
    evaluators:
      - CalledTool:
          name_regex: "^datagouv_"
          evaluation_name: called_datagouv
      - HasNoMatchingSpan:
          query:
            has_attributes:
              gen_ai.tool.name: "web_search"
          evaluation_name: did_not_call_web_search

  - name: gpl_rennes
    inputs:
      user_message: "Où trouver du GPL à Rennes et à quel prix ?"
