    doc_set: long
    description: Raffinement budget avec montants par lot
  evaluators: &id014
  - LLMJudge:
      rubric: The user asked to detail ONLY what was said about the budget across the meetings, with the
        amounts. Mentioning another topic only to explain its budget impact (e.g. a hosting choice that
        frees credits, a feature postponed to save money) is acceptable. PASS if the answer is focused
        on the budget and gives amounts. FAIL if substantial parts deal with non-budget topics without
        a budget angle, or if no amounts are given.
      include_input: true
  - FactRecall:
      facts:
      - 450 000
