- name: fait_initial
  inputs:
    user_message: Au fait, quel est mon numéro de dossier ?
    history_summary: |-
      **Résumé mis à jour du projet ALTO (au 15 avril 2026) :**

      Le projet ALTO vise à refondre le portail de prise de rendez-vous des usagers de la Direction départementale des services de Vallée-Basse. **Objectifs principaux** : réduire de moitié les appels liés aux rendez-vous, atteindre 80 % de rendez-vous en ligne, et supprimer la ressaisie manuelle par les agents.

      **Budget** : Initialement fixé à **450 000 € TTC** (développement 260 000 €, hébergement 90 000 €, formation 60 000 €, accessibilité 40 000 €). Après un **gel de crédits de 70 000 €** (mars 2026), l’enveloppe est ramenée à **380 000 € TTC** :
      - Développement : **200 000 €** (report du module de rappel par SMS et simplification des écrans de statistiques).
      - Formation : **50 000 €** (remplacement partiel des sessions sur site par des classes virtuelles).
      - Hébergement et accessibilité : maintenus à **90 000 €** et **40 000 €**.

      **Hébergement** :
      - **11 février** : Choix de la société **Nuage Ligérien** (29 000 €/an) sous réserve de l’avis de sécurité.
      - **9 avril** : **Avis défavorable** de M. Paul Girard (RSSI) en raison de l’impossibilité de garantir la localisation des données en France en cas d’incident majeur et de l’accès d’un sous-traitant hors UE.
      - **15 avril** : Décision d’héberger le portail au **centre de données ministériel** (sécurité conforme, données 100 % en France, délai de 8 semaines, coût limité à 12 000 € d’installation). Le contrat avec Nuage Ligérien ne sera pas signé. M. Benali doit informer Nuage Ligérien avant le **30 avril**.

      **Calendrier révisé** :
      - **4 mai 2026** : Démarrage du **pilote** sur les sites de **Saint-Aubin et Montclair** (environnement provisoire sécurisé).
      - **Fin mai** : Fin du pilote et préparation du bilan (présenté au comité du **10 juin**).
      - **Mi-juin** : Mise à disposition de l’environnement définitif au centre de données ministériel.
      - **Fin août** : Formation des agents des 4 autres sites (formation à distance pour s’adapter aux congés).
      - **1er septembre 2026** : Mise en service générale (reportée du 15 juin en raison du changement d’hébergement). Un **dispositif d’accompagnement renforcé** est prévu en septembre.

      **Équipe projet** :
      - **Mme Hélène Vasseur** : Cheffe de projet (coordination générale, suivi des prestataires).
      - **M. Julien Ferrand** : Chef de projet adjoint (recruté, en poste depuis le **1er avril**), responsable du pilote, de la relation avec les sites et de la préparation de la mise en service.
      - **M. Karim Benali** : Responsable des systèmes d’information (hébergement, développement).
      - **M. Paul Girard** : Responsable de la sécurité des systèmes d’information (avis critiques sur l’hébergement).
      - **M. Thomas Ricard** : Responsable de la formation (plan adapté avec sessions à distance).
      - **Mme Inès Moreau** : Référente accessibilité (audit RGAA en cours, corrections à livrer avant le **30 juin**).

      **Accessibilité** :
      - Audit des maquettes terminé : **taux de conformité de 72 %** (défauts sur contrastes, navigation clavier, formulaires). Corrections en cours par le prestataire de développement. Un **second audit** sera réalisé sur la version finale avant la mise en service.

      **Pilote** :
      - Sites : **Saint-Aubin** (6 200 rendez-vous/an) et **Montclair** (4 300 rendez-vous/an), choisis pour leur complémentarité et leur volontariat.
      - Organisation : Formation des agents la **semaine du 27 avril**, présence de M. Ferrand sur site la première semaine, points hebdomadaires, recueil des retours via questionnaires et entretiens.
      - Indicateurs cibles : 60 % de rendez-vous en ligne, réduction d’un quart des appels au standard, 12 % de rendez-vous non honorés (avec rappel par courriel uniquement).

      **Risques majeurs** :
      1. **Non-respect du délai de 8 semaines** pour la mise à disposition du centre de données ministériel (impact élevé sur la date du 1er septembre).
      2. **Mise en service en période de forte affluence** (rentrée de septembre) : atténué par le pilote et l’accompagnement renforcé.
      3. **Financement du module de rappel par SMS** : reporté à une version ultérieure (priorité identifiée par le secrétaire général M. Denis Aubry si crédits disponibles).

      **Prochaines échéances** :
      - **24 avril** : Finalisation de l’organisation du pilote (M. Ferrand).
      - **27 avril** : Livraison de la première version testable du portail et formation des agents des sites pilotes.
      - **30 avril** : Information de Nuage Ligérien (M. Benali).
      - **10 juin** : Bilan du pilote présenté au comité (M. Ferrand).
      - **30 juin** : Corrections d’accessibilité (Mme Moreau).

      **Décisions clés** :
      - Validation des objectifs et du périmètre (14 janvier).
      - Report du module SMS et réduction du budget (18 mars).
      - Abandon de Nuage Ligérien et choix du centre de données ministériel (15 avril).
      - Report de la mise en service au **1er septembre 2026**.

      **Communication** :
      - Transparence sur les reports (sécurité des données, calendrier).
      - Campagne d’information des usagers décalée à **fin août**, enrichie des enseignements du pilote.
      - Session d’information interne en visioconférence **fin avril** avec la directrice.

      **Participants aux comités** :
      - **Membres permanents** : Mme Dumoulin (directrice), Mme Vasseur, M. Benali, M. Ricard, Mme Moreau, M. Girard, M. Aubry (secrétaire général).
      - **Invités** : Chargé de communication, responsables de sites, correspondants locaux, représentante d’une association d’usagers en situation de handicap.
