# Longues conversations, figées dans l'état qu'elles ont après le résumé de l'historique.
# Chaque cas part de 5 échanges : une règle ou un fait au tour 1, puis 4 tours qui collent chacun
# trois comptes rendus longs (≈ 108k tokens, au-delà du budget d'historique de 131072 tokens de
# contexte). history_summary est le résumé que la production en a tiré (generate_history_summary,
# default-summarization-model, généré une fois et copié tel quel) ; message_history est la fenêtre
# qu'elle garde ensuite (build_active_history : les 3 derniers échanges). Le tour 1 n'est donc
# visible que par le résumé, qui l'a omis dans les trois cas : fait_initial ne peut pas réussir, et
# les règles ne tiennent qu'en imitant les réponses récentes. controle_sous_budget garde la règle
# dans l'historique (≈ 54k tokens, aucun résumé).

evaluators:
- ToolsUsed
cases:
- name: regle_langue
  inputs:
    user_message: Résume en trois phrases l'avancement global du projet.
    history_summary: |-
      ### **Updated Summary of ALTO Project (as of 15 April 2026):**

      1. **Project Overview:**
         - The ALTO project aims to overhaul the user appointment portal for Vallée-Basse’s departmental services, addressing inefficiencies in the current system (slow performance, lack of mobile compatibility, manual re-entry of data, and security vulnerabilities).
         - **Key Objectives:** Reduce phone calls related to appointments by half, achieve 80% online bookings, and eliminate manual data re-entry by agents.

      2. **Budget:**
         - Initial budget: **€450,000** (development: €260K, hosting: €90K, training: €60K, accessibility: €40K).
         - **Revised Budget (18 March):** Reduced to **€380,000** due to a **€70,000 credit freeze** (ministry-level).
           - **Adjustments:**
             - Development: **€200K** (SMS reminder module deferred; email reminders retained).
             - Training: **€50K** (partial shift to remote sessions).
             - Hosting and accessibility budgets unchanged.
           - **Deferred Features:** SMS reminders (prioritized for future funding), customizable dashboards for site managers.

      3. **Hosting:**
         - **Initial Plan:** External hosting tender won by **Nuage Ligérien** (€29K/year), but **security concerns** arose:
           - Data localization in France not guaranteed during major incidents (backup center in another EU country).
           - Subcontractor access from outside the EU.
         - **Decision (15 April):** Abandon Nuage Ligérien. **Switch to ministerial data center** (no additional hosting cost; €12K setup fee).
           - **Impact:** Go-live delayed from **15 June to 1 September 2026** due to 8-week setup time.
           - **Security:** Fully compliant (data stored exclusively in France, state-run).

      4. **Timeline & Milestones:**
         - **Pilot Phase:**
           - **4 May 2026:** Pilot launch on **Saint-Aubin and Montclair sites** (25% of appointments; rural users).
           - **Duration:** 4 weeks (training for pilot agents: **27 April**).
           - **Environment:** Temporary, secured infrastructure (real data limited to pilot sites).
         - **Development:**
           - Provider selected **30 March**; kickoff **7 April**.
           - Testable version delivered **27 April** (for pilot).
           - Final version (with pilot feedback + accessibility fixes): **End of June**.
         - **Go-Live:**
           - **1 September 2026:** Full deployment across all sites.
           - **August:** Training for remaining agents (remote + on-site).
           - **September:** Enhanced support for first weeks (referents on each site).

      5. **Team & Governance:**
         - **Core Team:**
           - **Project Lead:** Mme Hélène Vasseur.
           - **Deputy Project Manager:** M. Julien Ferrand (joined **1 April**; oversees pilot).
           - **IT/Security:** M. Karim Benali (hosting), M. Paul Girard (security).
           - **HR/Training:** Mme Sophie Lemarchand, M. Thomas Ricard.
           - **Accessibility:** Mme Inès Moreau.
         - **Local Correspondents:** Designated per site to relay feedback.

      6. **Accessibility:**
         - **Audit Results (15 April):** 72% compliance with RGAA standards.
           - **Issues:** Color contrast, keyboard navigation, form error messages.
           - **Action:** Fixes required before go-live; **second audit** planned for final version.
         - **Involvement:** Disability association representative participating in tests/pilot.

      7. **Risks & Mitigations:**
         - **Hosting Security Risk:** Resolved by switching to ministerial data center.
         - **Budget Risk:** Mitigated via fallback plan; SMS module deferred.
         - **Peak Period Go-Live:** Addressed with pilot learnings + reinforced support.
         - **Agent Availability:** Training scheduled around leave periods; remote options.

      8. **Communication:**
         - **Internal:** Monthly newsletters, intranet updates, Q&A form for agents.
         - **Pilot Users:** Posters, flyers, website notices, and mayoral outreach (from **end of April**).
         - **General Public:** Campaign delayed to **end of August** (post-pilot insights).

      9. **Key Decisions:**
         - **14 Jan:** Budget approved; go-live set for 15 June.
         - **11 Feb:** Nuage Ligérien selected (pending security approval); accessibility audit ordered.
         - **18 March:** Budget cut to €380K; SMS module deferred; pilot confirmed.
         - **15 April:** Ministerial data center chosen; go-live delayed to **1 September**; pilot maintained.

      10. **Next Deadlines:**
          - **30 April:** Notify Nuage Ligérien of contract cancellation (M. Benali).
          - **10 June:** Pilot review presentation (M. Ferrand).
          - **30 June:** Accessibility fixes (Mme Moreau).
          - **End August:** Training for non-pilot sites.
          - **1 September:** Full deployment.

      ---
      **Note:** The project remains on track to meet core objectives despite budget cuts and hosting delays, with a focus on security, accessibility, and agent/user adoption.
    message_history:
    - role: user
      content: |-
        Voici trois autres comptes rendus :

        {{paste:long-cr-04}}

        {{paste:long-cr-01}}

        {{paste:long-cr-02}}

        Quelles décisions ont été prises sur le budget ?
    - role: assistant
      content: |-
        On the budget:

        - 14 January: the committee approves a €450,000 envelope including VAT (development €260,000, hosting €90,000, training €60,000, accessibility €40,000), with a contingency margin of about 8% per lot.
        - 11 February: Nuage Ligérien's offer (€29,000 a year, €87,000 over three years) fits the hosting lot; the SMS reminder module becomes an optional tranche and Mr Benali is asked for a fallback plan.
        - 15 April: the envelope stays at €380,000 after the credit freeze; choosing the ministerial data centre adds no hosting cost (€12,000 for setup), and Mr Aubry wants the freed credits to bring back SMS reminders first.
    - role: user
      content: |-
        Voici encore trois comptes rendus :

        {{paste:long-cr-03}}

        {{paste:long-cr-04}}

        {{paste:long-cr-01}}

        Quelles sont les prochaines échéances ?
    - role: assistant
      content: |-
        As of the latest committee (15 April 2026):

        - 30 April: Mr Benali tells Nuage Ligérien no contract will be signed;
        - 4 May: the four-week pilot starts in Saint-Aubin and Montclair;
        - 10 June: Mr Ferrand presents the pilot review to the committee;
        - mid-June: the final environment is ready at the ministerial data centre;
        - 30 June: accessibility fixes, owned by Ms Moreau;
        - July: security tests, load tests and the second accessibility audit;
        - end of August: training for the four other sites;
        - 1 September 2026: go-live on every site.
    - role: user
      content: |-
        Et ces trois derniers :

        {{paste:long-cr-02}}

        {{paste:long-cr-03}}

        {{paste:long-cr-04}}

        Qui est responsable de l'hébergement ?
    - role: assistant
      content: 'Hosting is handled by Mr Karim Benali, head of information systems: he ran the tender, studied the alternative and must tell Nuage Ligérien the contract is dropped. Mr Paul Girard, the security officer, issued the negative opinion on Nuage Ligérien on 9 April. Since the 15 April committee, the portal will be hosted at the ministerial data centre, run by State staff.'
