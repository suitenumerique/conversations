- name: regle_signature
  inputs:
    user_message: Résume en trois phrases l'avancement global du projet.
    history_summary: |-
      **Résumé mis à jour du projet ALTO (au 15 avril 2026) :**

      Le projet ALTO vise à refondre le portail de prise de rendez-vous des usagers de la direction départementale de Vallée-Basse. **Objectifs principaux** : réduire de moitié les appels liés aux rendez-vous, atteindre 80 % de rendez-vous en ligne, et supprimer la ressaisie manuelle par les agents. Le périmètre inclut la prise de rendez-vous en ligne, la gestion des agendas, les confirmations/rappels (courriel maintenu, SMS reporté), et la production de statistiques.

      **Budget** : Initialement fixé à **450 000 € TTC** (développement 260 000 €, hébergement 90 000 €, formation 60 000 €, accessibilité 40 000 €). Après un **gel de crédits de 70 000 €** (mars 2026), l’enveloppe est réduite à **380 000 € TTC** :
      - Développement : 200 000 € (report du module SMS et simplification des statistiques).
      - Formation : 50 000 € (remplacement partiel des sessions sur site par des classes virtuelles).
      - Hébergement et accessibilité : maintenus.

      **Calendrier révisé** :
      - **4 mai 2026** : Démarrage du **pilote** sur les sites de **Saint-Aubin et Montclair** (4 semaines, environnement provisoire).
      - **10 juin 2026** : Bilan du pilote présenté au comité.
      - **Mi-juin** : Mise à disposition de l’environnement définitif au **centre de données ministériel** (choisi après avis défavorable sur Nuage Ligérien pour non-respect de la localisation des données en France en cas d’incident).
      - **Fin août** : Formation des agents des 4 autres sites.
      - **1er septembre 2026** : Mise en service générale (reportée du 15 juin en raison du changement d’hébergement).

      **Équipe et gouvernance** :
      - **Mme Claire Dumoulin** (directrice) préside les comités de pilotage mensuels.
      - **Mme Hélène Vasseur** (cheffe de projet) anime les comités de projet hebdomadaires.
      - **M. Julien Ferrand** (chef de projet adjoint, arrivé le 1er avril) gère le pilote et la mise en service.
      - **M. Karim Benali** (responsable SI) supervise l’hébergement et le développement.
      - **M. Paul Girard** (RSSI) a validé les exigences de sécurité (localisation France, chiffrement, traçabilité).
      - **M. Thomas Ricard** (formation) et **Mme Inès Moreau** (accessibilité, audit RGAA à 72 % sur les maquettes) complètent l’équipe.

      **Décisions clés** :
      - **Hébergement** : Abandon de Nuage Ligérien (avis défavorable du RSSI) au profit du **centre de données ministériel** (sécurité conforme, coût limité à 12 000 € d’installation).
      - **Pilote** : Maintenu sur Saint-Aubin et Montclair avec formation prioritaire des agents (semaine du 27 avril).
      - **Accessibilité** : Audit sur maquettes terminé (72 % de conformité RGAA), corrections en cours pour la version finale.
      - **Communication** : Transparence sur le report (sécurité des données) et maintien des canaux existants (téléphone, guichet).

      **Risques principaux** :
      - Respect du délai de 8 semaines pour le centre de données ministériel.
      - Mise en service en période de forte affluence (septembre), atténuée par le pilote et un dispositif d’accompagnement renforcé.
      - Financement futur du module SMS (priorité identifiée).

      **Prochaines échéances** :
      - **30 avril** : Information de Nuage Ligérien (M. Benali).
      - **10 juin** : Bilan du pilote (M. Ferrand).
      - **30 juin** : Corrections d’accessibilité (Mme Moreau).

      FIN
