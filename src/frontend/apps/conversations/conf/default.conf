server {
  listen 8080;
  listen 3000;
  server_name localhost;

  # Emit relative Location headers on directory redirects. Behind the TLS
  # ingress, absolute redirects would otherwise leak nginx's own scheme/port
  # (e.g. http://host:8080/), which is unreachable publicly.
  absolute_redirect off;

  root /usr/share/nginx/html;

  # The API is served from its own origin; this server only holds static files.
  # Without this, an /api request sent here by mistake would reach the fallback
  # below and answer 200 with index.html instead of failing.
  location /api/ {
      return 404;
  }

  # Build output under /_app/ has a content hash in its name: it never changes,
  # so browsers can keep it for good. A missing file (a chunk of a previous
  # release) must answer 404, not fall back to index.html.
  # `add_header` is not inherited when a location defines its own.
  location /_app/ {
      try_files $uri =404;

      add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Single-page app: every unknown path is handed to the client router, which
  # renders the 404 page itself. Unknown paths therefore answer 200, not 404.
  # index.html and public files keep a stable name: the browser must revalidate
  # them, so that it always gets the chunk list of the current release.
  location / {
      try_files $uri $uri/ /index.html;

      add_header Cache-Control "no-cache";
  }
}
