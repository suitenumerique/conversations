<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="640" viewBox="0 0 1010 640" role="img" aria-label="The web app calls the Conversations backend. The backend queues tasks on Redis and stores data in PostgreSQL. Celery beat schedules tasks, the Celery worker runs them, writes to PostgreSQL and reads files from S3. The web app uploads files straight to S3. The backend calls the OIDC provider, agent tools and malware scan; the backend and the worker both call the LLM providers and the Albert API.">
          <style>
    svg { --frame:#ffffff; --panel:#eef1f6; --box:#ffffff; --store:#e6eefb; --fg:#182030; --muted:#5d687a; --line:#8893a5; --border:#c5ccd8; --accent:#3f72c9; }
    @media (prefers-color-scheme: dark) {
      svg { --frame:#161a21; --panel:#1b2029; --box:#1f2530; --store:#19253a; --fg:#e7ebf1; --muted:#98a2b3; --line:#7f8a9c; --border:#3b4453; --accent:#5b8ad8; }
    }
    text { fill: var(--fg); font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .t { font-size: 15px; font-weight: 600; }
    .s { fill: var(--muted); font-size: 12px; }
    .h { fill: var(--muted); font-size: 11.5px; font-weight: 600; letter-spacing: 0.1em; }
    .l { font-size: 12px; paint-order: stroke; stroke: var(--frame); stroke-width: 6px; stroke-linejoin: round; }
    .frame { fill: var(--frame); stroke: var(--border); stroke-width: 1; }
    .panel { fill: var(--panel); stroke: var(--border); stroke-width: 1; }
    .box { fill: var(--box); stroke: var(--border); stroke-width: 1.4; }
    .box.opt { fill: none; stroke-dasharray: 6 5; }
    .store { fill: var(--store); stroke: var(--accent); stroke-width: 1.4; }
    .e { fill: none; stroke: var(--line); stroke-width: 1.5; }
    .e.d { stroke-dasharray: 6 5; }
    .tip { fill: var(--line); }
  </style>
  <defs>
            <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" class="tip"/>
            </marker>
          </defs>

          <rect class="frame" x="16" y="16" width="978" height="608" rx="14"/>

          <!-- CLIENTS -->
          <rect class="panel" x="40" y="66" width="182" height="126" rx="10"/>
          <text class="h" x="56" y="92">CLIENTS</text>
          <rect class="box" x="56" y="108" width="150" height="64" rx="8"/>
          <text class="t" x="131" y="136" text-anchor="middle">Web app</text>
          <text class="s" x="131" y="156" text-anchor="middle">Vite + React SPA</text>

          <!-- BACKEND -->
          <rect class="panel" x="285" y="66" width="420" height="126" rx="10"/>
          <text class="h" x="305" y="92">CONVERSATIONS BACKEND</text>
          <rect class="box" x="305" y="108" width="180" height="64" rx="8"/>
          <text class="t" x="395" y="136" text-anchor="middle">App API</text>
          <text class="s" x="395" y="156" text-anchor="middle">Django ASGI, chat agent</text>
          <rect class="box" x="505" y="108" width="180" height="64" rx="8"/>
          <text class="t" x="595" y="136" text-anchor="middle">Django admin</text>
          <text class="s" x="595" y="156" text-anchor="middle">used by staff</text>

          <!-- Web app -> API -->
          <line class="e" x1="206" y1="140" x2="303" y2="140" marker-end="url(#arw)"/>
          <text class="l" x="254" y="132" text-anchor="middle">REST</text>
          <text class="l" x="254" y="157" text-anchor="middle">streaming</text>

          <!-- Redis -->
          <path class="store" d="M310,240 A85,10 0 0 1 480,240 V290 A85,10 0 0 1 310,290 Z"/>
          <ellipse class="store" cx="395" cy="240" rx="85" ry="10"/>
          <text class="t" x="395" y="270" text-anchor="middle">Redis</text>
          <text class="s" x="395" y="287" text-anchor="middle">task queue, cache</text>

          <!-- PostgreSQL -->
          <path class="store" d="M510,240 A85,10 0 0 1 680,240 V290 A85,10 0 0 1 510,290 Z"/>
          <ellipse class="store" cx="595" cy="240" rx="85" ry="10"/>
          <text class="t" x="595" y="276" text-anchor="middle">PostgreSQL</text>

          <!-- Backend -> stores -->
          <line class="e" x1="395" y1="192" x2="395" y2="228" marker-end="url(#arw)"/>
          <text class="l" x="395" y="214" text-anchor="middle">queues tasks</text>
          <line class="e" x1="595" y1="192" x2="595" y2="228" marker-end="url(#arw)"/>

          <!-- BACKGROUND JOBS -->
          <rect class="panel" x="285" y="332" width="420" height="124" rx="10"/>
          <text class="h" x="305" y="358">BACKGROUND JOBS</text>
          <rect class="box" x="305" y="372" width="180" height="68" rx="8"/>
          <text class="t" x="395" y="397" text-anchor="middle">Celery beat</text>
          <text class="s" x="395" y="416" text-anchor="middle">polls model health</text>
          <text class="s" x="395" y="431" text-anchor="middle">purges old data</text>
          <rect class="box" x="505" y="372" width="180" height="68" rx="8"/>
          <text class="t" x="595" y="397" text-anchor="middle">Celery worker</text>
          <text class="s" x="595" y="416" text-anchor="middle">parses + indexes files</text>
          <text class="s" x="595" y="431" text-anchor="middle">summarizes, tabular</text>

          <!-- Beat -> Redis, Redis -> Worker, Worker -> PostgreSQL -->
          <line class="e" x1="455" y1="372" x2="455" y2="300" marker-end="url(#arw)"/>
          <text class="l" x="455" y="322" text-anchor="middle">schedules</text>
          <line class="e" x1="478" y1="296" x2="532" y2="369" marker-end="url(#arw)"/>
          <text class="l" x="508" y="330" text-anchor="middle">runs</text>
          <line class="e" x1="620" y1="372" x2="620" y2="302" marker-end="url(#arw)"/>

          <!-- S3 -->
          <path class="store" d="M510,500 A85,10 0 0 1 680,500 V550 A85,10 0 0 1 510,550 Z"/>
          <ellipse class="store" cx="595" cy="500" rx="85" ry="10"/>
          <text class="t" x="595" y="530" text-anchor="middle">S3 storage</text>
          <text class="s" x="595" y="547" text-anchor="middle">attachments, private</text>

          <line class="e" x1="595" y1="440" x2="595" y2="488" marker-end="url(#arw)"/>
          <text class="l" x="595" y="468" text-anchor="middle">reads files</text>

          <!-- Web app -> S3, presigned upload -->
          <path class="e d" d="M206,160 H250 V525 H508" marker-end="url(#arw)"/>
          <text class="l" x="380" y="529" text-anchor="middle">uploads (presigned)</text>

          <!-- EXTERNAL -->
          <text class="h" x="800" y="92">EXTERNAL</text>
          <rect class="box" x="800" y="108" width="180" height="64" rx="8"/>
          <text class="t" x="890" y="136" text-anchor="middle">OIDC provider</text>
          <text class="s" x="890" y="156" text-anchor="middle">Keycloak / ProConnect</text>
          <rect class="box" x="800" y="190" width="180" height="60" rx="8"/>
          <text class="t" x="890" y="216" text-anchor="middle">Agent tools</text>
          <text class="s" x="890" y="235" text-anchor="middle">web search, MCP, Docs</text>
          <rect class="box" x="800" y="270" width="180" height="60" rx="8"/>
          <text class="t" x="890" y="296" text-anchor="middle">Malware scan</text>
          <text class="s" x="890" y="315" text-anchor="middle">calls back when done</text>
          <rect class="box" x="800" y="358" width="180" height="60" rx="8"/>
          <text class="t" x="890" y="384" text-anchor="middle">LLM providers</text>
          <text class="s" x="890" y="403" text-anchor="middle">Albert, OpenAI, Mistral</text>
          <rect class="box" x="800" y="438" width="180" height="60" rx="8"/>
          <text class="t" x="890" y="464" text-anchor="middle">Albert API</text>
          <text class="s" x="890" y="483" text-anchor="middle">RAG, parsing, OCR</text>
          <rect class="box opt" x="800" y="540" width="180" height="60" rx="8"/>
          <text class="t" x="890" y="566" text-anchor="middle">Observability</text>
          <text class="s" x="890" y="585" text-anchor="middle">optional</text>

          <!-- Backend -> OIDC -->
          <line class="e" x1="705" y1="140" x2="798" y2="140" marker-end="url(#arw)"/>
          <text class="l" x="752" y="132" text-anchor="middle">login</text>

          <!-- Backend -> tools + malware (outer trunk x=750) -->
          <path class="e" d="M705,160 H750 V300"/>
          <line class="e" x1="750" y1="220" x2="798" y2="220" marker-end="url(#arw)"/>
          <text class="l" x="774" y="212" text-anchor="middle">calls</text>
          <line class="e" x1="750" y1="300" x2="798" y2="300" marker-end="url(#arw)"/>
          <text class="l" x="774" y="292" text-anchor="middle">scans</text>

          <!-- Backend + worker -> AI (inner trunk x=728) -->
          <path class="e" d="M705,180 H728 V468"/>
          <line class="e" x1="685" y1="410" x2="728" y2="410"/>
          <line class="e" x1="728" y1="388" x2="798" y2="388" marker-end="url(#arw)"/>
          <text class="l" x="763" y="380" text-anchor="middle">prompts</text>
          <line class="e" x1="728" y1="468" x2="798" y2="468" marker-end="url(#arw)"/>
          <text class="l" x="763" y="460" text-anchor="middle">RAG</text>
        </svg>
